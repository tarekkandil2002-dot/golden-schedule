<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16233B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>جدول الحصص الذهبي</title>
<style>
:root{--navy:#16233B;--gold:#C8962E;--gold-soft:#F3E6C4;--bg:#EAF4FF;--ink:#1B2433;--mute:#667085;--line:#DDE2EA;--red:#B42318}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{background:var(--navy);text-align:center;padding:14px 12px 22px;line-height:1.7}
header small{display:block;color:var(--gold-soft);font-size:13px}
header h1{font-size:22px;color:var(--gold)}
header .t{font-size:15px;color:#fff}
.next{background:#fff;border:2px solid var(--gold);border-radius:26px 26px 26px 8px;margin:-14px 14px 10px;padding:9px 12px;text-align:center;font-size:14px;color:var(--mute);line-height:1.6}
.next b{display:block;font-size:18px;color:var(--navy)}
.gw{padding:0 6px}
table{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff}
th,td{border:1.5px solid var(--navy);text-align:center;padding:0}
th{background:var(--navy);color:#fff;font-size:11.5px;padding:8px 0}
th.today{background:var(--gold)}
th.pc{width:50px}
td{height:54px;font-size:16px;font-weight:700;color:var(--navy);position:relative}
td.pc{background:var(--gold-soft);font-size:17px;line-height:1.15}
td.pc small{display:block;font-size:10px;font-weight:400;color:var(--mute)}
td.c i{position:absolute;top:2px;inset-inline-start:3px;font-style:normal;font-size:10px;font-weight:800;color:inherit;opacity:.9}
td.live{box-shadow:inset 0 0 0 4px var(--navy);font-size:18px}
.bar{background:#fff;border:1px dashed var(--gold);border-radius:10px;padding:10px 12px;margin:0 8px 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;background:var(--gold);color:#fff}
.btn.alt{background:var(--navy)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.dock{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;justify-content:center}
.dock .btn{flex:1;max-width:240px}
dialog{max-height:90vh;overflow:auto;border:0;border-radius:14px;padding:18px;width:min(94vw,440px);margin:auto;direction:rtl}
dialog::backdrop{background:rgba(22,35,59,.55)}
h3{margin-bottom:4px}h4{margin:16px 0 2px;color:var(--navy)}
label{display:block;font-size:14px;margin:10px 0 4px;color:var(--mute)}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
input[type=checkbox]{width:auto}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>span{flex:0 0 56px;font-size:14px}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:15px;color:var(--ink)}
.acts{display:flex;gap:8px;margin-top:16px}.acts .btn{flex:1}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:16px}
.note{font-size:12.5px;color:var(--mute);line-height:1.6;margin-top:6px}
#toast{position:fixed;top:10px;inset-inline:10px;z-index:99;background:var(--gold);color:var(--navy);border-radius:14px;padding:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:17px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#toast button{border:0;background:var(--navy);color:#fff;border-radius:8px;padding:8px 14px;font:inherit}
header [data-h],th,td.pc{cursor:pointer}header em{font-style:normal;opacity:.55;font-size:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header id="hdr"></header>
<div class="next" id="next"></div>
<div class="bar" id="permBar" hidden><span>فعّل الإشعارات والصوت عشان يوصلك تنبيه قبل كل حصة.</span><button class="btn" id="permBtn">تفعيل</button></div>
<div class="gw" id="grid"></div>
<p class="note" style="text-align:center;margin:8px 12px">اضغط على أي نص أو خانة أو ميعاد عشان تعدّله</p>
<div class="dock">
  <button class="btn" id="setBtn">الإعدادات</button>
  <button class="btn alt" id="icsBtn">تصدير للتقويم</button>
</div>
<div id="toast" hidden></div>

<dialog id="dlg">
  <h3>الحصة</h3>
  <label>اليوم</label><select id="fDay"></select>
  <div class="row"><div><label>تبدأ من</label><select id="fP"></select></div><div><label>المدة</label><select id="fN"><option value="1">حصة</option><option value="2">حصتين</option></select></div></div>
  <label>الفصل</label><input id="fName" placeholder="مثال: 7/2">
  <label>المادة (حرف أو اسم قصير)</label><input id="fSub" placeholder="E">
  <div class="err" id="err"></div>
  <div class="acts"><button class="btn" id="saveBtn">حفظ</button><button class="btn ghost" id="cancelBtn">إلغاء</button></div>
  <div class="acts"><button class="btn ghost" id="delBtn" style="color:var(--red)">حذف الحصة</button></div>
</dialog>

<dialog id="dlgE">
  <h3 id="eT"></h3>
  <div id="eTxtW"><input id="eV"></div>
  <div id="ePW" class="row" style="margin-top:10px"><div><label>من</label><input type="time" id="eS"></div><div><label>إلى</label><input type="time" id="eE"></div></div>
  <div class="err" id="eErr"></div>
  <div class="acts"><button class="btn" id="eSave">حفظ</button><button class="btn ghost" id="eCancel">إلغاء</button></div>
</dialog>

<dialog id="dlg2">
  <h3>الإعدادات</h3>
  <h4>بيانات الجدول</h4>
  <label>المحافظة</label><input id="iGov">
  <label>الإدارة</label><input id="iAdm">
  <label>المدرسة</label><input id="iSch">
  <label>المعلم</label><input id="iTea">
  <h4>التنبيه</h4>
  <label>قبل الحصة بـ (دقائق)</label><input type="number" id="fLead" min="1" max="60">
  <label class="chk"><input type="checkbox" id="fSnd"> صوت تنبيه</label>
  <label class="chk"><input type="checkbox" id="fVc"> إعلان صوتي بالكلام</label>
  <button class="btn alt" id="testBtn" type="button">جرّب التنبيه الآن</button>
  <p class="note">التنبيهات (الصوت والإشعار والرسالة) بتشتغل والتطبيق مفتوح. للتنبيه والتطبيق مقفول استخدم «تصدير للتقويم».</p>
  <h4>مواعيد الحصص</h4>
  <div id="pRows"></div>
  <div class="err" id="err2"></div>
  <div class="acts"><button class="btn" id="sSave">حفظ</button><button class="btn ghost" id="sCancel">إلغاء</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const DN={6:'السبت',0:'الأحد',1:'الاثنين',2:'الثلاثاء',3:'الأربعاء',4:'الخميس'};
const dn=d=>(S.dn&&S.dn[d])||DN[d];
const DAYS=[6,0,1,2,3,4], ICS={0:'SU',1:'MO',2:'TU',3:'WE',4:'TH',5:'FR',6:'SA'};
const P0=[['07:30','08:10'],['08:10','08:50'],['08:50','09:30'],['09:30','10:10'],['10:10','10:50'],['10:50','11:30'],['11:30','12:00'],['12:00','12:30'],['12:30','13:00']];
// [يوم, أول حصة, عدد الحصص, الفصل]
const C0=[[6,1,1,'7/2'],[6,3,1,'8/2'],[6,6,2,'10/2'],[0,3,1,'8/3'],[0,6,2,'9/4'],[1,1,2,'10/2'],[1,4,2,'7/2'],[2,1,2,'8/3'],[2,3,2,'7/2'],[2,6,2,'8/2'],[3,1,2,'9/4'],[3,3,2,'8/3'],[4,2,1,'10/2'],[4,3,2,'8/2']];
const PAL=[['#F2545B','#fff'],['#3A86FF','#fff'],['#FFD93D','#3B3000'],['#8B5CF6','#fff'],['#2FBF71','#06361C'],['#FF9F1C','#3B2300'],['#FF8FC7','#4A0D2B'],['#2EC4B6','#05403B']];
const PST=['#FFE3E3','#FFF0D9','#FFF8CC','#DFF6E3','#DCEBFF','#EBE0FF','#FFE0EF','#D8F5F1','#FFEAD1'];
let S={cmap:{'7/2':0,'8/2':1,'10/2':2,'8/3':3,'9/4':4},info:{gov:'محافظة الإسكندرية',admin:'',school:'مجمع سيدي بشر',teacher:'طارق إبراهيم'},
  periods:P0.map(([start,end])=>({start,end})),
  classes:C0.map((a,i)=>({id:'d'+i,day:a[0],p:a[1],n:a[2],name:a[3],subject:'E'})),
  lead:5,sound:true,voice:true,notified:{}};
try{const r=JSON.parse(localStorage.getItem('ghs3')||'null');if(r)S=Object.assign(S,r)}catch(e){}
S.dn=S.dn||{};
const save=()=>{try{localStorage.setItem('ghs3',JSON.stringify(S))}catch(e){}};
const colorOf=n=>{if(!(n in S.cmap)){S.cmap[n]=Object.keys(S.cmap).length%PAL.length;save()}return PAL[S.cmap[n]]};
const mins=t=>{const[a,b]=t.split(':');return+a*60+ +b};
const st=c=>S.periods[c.p-1].start, en=c=>S.periods[c.p+c.n-2].end;
const hm=t=>{const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')};
const hmf=t=>hm(t)+(+t.split(':')[0]<12?' ص':' م');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byDay=d=>S.classes.filter(c=>c.day===d).sort((a,b)=>a.p-b.p);
const mw=m=>m===1?'دقيقة واحدة':m===2?'دقيقتين':m+(m<11?' دقائق':' دقيقة');

function nextClass(){
  const n=new Date(),nm=n.getHours()*60+n.getMinutes()+n.getSeconds()/60;
  for(let o=0;o<8;o++){const d=(n.getDay()+o)%7;
    for(const c of byDay(d)){const diff=o*1440+mins(st(c))-nm;if(diff>0)return{c,diff}}}
  return null;
}
function fmtDiff(m){m=Math.ceil(m);if(m<60)return m+' دقيقة';
  if(m<1440){const h=Math.floor(m/60),r=m%60;return h+' ساعة'+(r?' و '+r+' دقيقة':'')}
  return Math.floor(m/1440)+' يوم'}
function render(){
  const i=S.info,today=new Date().getDay(),n=new Date(),nm=n.getHours()*60+n.getMinutes();
  const L=(k,t,ph,tag,pre)=>'<'+tag+' data-h="'+k+'" data-t="'+t+'">'+(i[k]?(pre||'')+esc(i[k]):'<em>'+ph+'</em>')+'</'+tag+'>';
  $('#hdr').innerHTML=L('gov','المحافظة','اضغط لإضافة المحافظة','small')+L('admin','الإدارة','اضغط لإضافة الإدارة','small')+L('school','المدرسة','اضغط لإضافة اسم المدرسة','h1')+L('teacher','اسم المعلم','اضغط لإضافة اسم المعلم','div','أ/ ');
  const x=nextClass();
  $('#next').style.borderColor=x?colorOf(x.c.name)[0]:'var(--gold)';$('#next').innerHTML=x?'الحصة الجاية بعد '+fmtDiff(x.diff)+'<b>'+esc(x.c.name)+' - '+esc(x.c.subject)+'</b>'+dn(x.c.day)+' '+hmf(st(x.c)):'دوس على أي خانة فاضية عشان تضيف حصة';
  let h='<table><tr><th class="pc">'+esc(S.info.corner||'الحصة')+'</th>'+DAYS.map(d=>'<th data-d="'+d+'" class="'+(d===today?'today':'')+'">'+esc(dn(d))+'</th>').join('')+'</tr>';
  for(let p=1;p<=S.periods.length;p++){
    h+='<tr><td class="pc" data-pi="'+(p-1)+'" style="background:'+PST[(p-1)%PST.length]+'">'+p+'<small>'+hm(S.periods[p-1].start)+'</small></td>';
    for(const d of DAYS){
      const c=S.classes.find(k=>k.day===d&&k.p<=p&&p<k.p+k.n);
      if(c){if(c.p===p){const live=d===today&&nm>=mins(st(c))&&nm<mins(en(c));
        const k=colorOf(c.name);h+='<td class="c'+(live?' live':'')+'" style="background:'+k[0]+';color:'+k[1]+'" rowspan="'+c.n+'" data-id="'+c.id+'"><i>'+esc(c.subject)+'</i>'+esc(c.name)+'</td>'}}
      else h+='<td data-d="'+d+'" data-p="'+p+'"></td>';
    }
    h+='</tr>';
  }
  $('#grid').innerHTML=h+'</table>';
  $('#permBar').hidden=!('Notification' in window)||Notification.permission==='granted';
}
$('#grid').onclick=e=>{const c=e.target.closest('th,td');if(!c)return;
  if(c.tagName==='TH'){c.dataset.d!==undefined?openEdit('day',c.dataset.d,'اسم اليوم',dn(c.dataset.d)):openEdit('info','corner','عنوان العمود',S.info.corner||'الحصة');return}
  if(c.classList.contains('pc')){openEdit('p',+c.dataset.pi,'مواعيد الحصة '+(+c.dataset.pi+1));return}
  c.dataset.id?openForm(c.dataset.id):openForm(null,+c.dataset.d,+c.dataset.p)};
$('#hdr').onclick=e=>{const k=e.target.closest('[data-h]');if(k)openEdit('info',k.dataset.h,k.dataset.t,S.info[k.dataset.h])};
let em=null;
function openEdit(type,key,title,val){em={type,key};$('#eT').textContent=title;
  $('#eTxtW').hidden=type==='p';$('#ePW').hidden=type!=='p';
  if(type==='p'){const p=S.periods[key];$('#eS').value=p.start;$('#eE').value=p.end}else $('#eV').value=val||'';
  $('#eErr').textContent='';$('#dlgE').showModal()}
$('#eCancel').onclick=()=>$('#dlgE').close();
$('#eSave').onclick=()=>{
  if(em.type==='p'){const a=$('#eS').value,b=$('#eE').value;
    if(!a||!b||mins(b)<=mins(a)){$('#eErr').textContent='النهاية لازم تكون بعد البداية.';return}
    S.periods[em.key]={start:a,end:b}}
  else{const v=$('#eV').value.trim();
    if(em.type==='info')S.info[em.key]=v||(em.key==='school'?'جدول الحصص':(em.key==='corner'?'الحصة':''));
    else if(v)S.dn[em.key]=v;else delete S.dn[em.key]}
  save();$('#dlgE').close();render()};

let edit=null;
function openForm(id,d,p){
  const c=id?S.classes.find(x=>x.id===id):{day:d,p:p,n:1,name:'',subject:'E'};edit=id||null;
  $('#fDay').innerHTML=DAYS.map(x=>`<option value="${x}">${dn(x)}</option>`).join('');
  $('#fP').innerHTML=S.periods.map((q,i)=>`<option value="${i+1}">الحصة ${i+1} (${hm(q.start)})</option>`).join('');
  $('#fDay').value=c.day;$('#fP').value=c.p;$('#fN').value=c.n;$('#fName').value=c.name;$('#fSub').value=c.subject;
  $('#err').textContent='';$('#delBtn').parentElement.hidden=!id;$('#dlg').showModal();
}
$('#cancelBtn').onclick=()=>$('#dlg').close();
$('#delBtn').onclick=()=>{if(confirm('تحذف الحصة دي؟')){S.classes=S.classes.filter(x=>x.id!==edit);save();$('#dlg').close();render()}};
$('#saveBtn').onclick=()=>{
  const c={day:+$('#fDay').value,p:+$('#fP').value,n:+$('#fN').value,name:$('#fName').value.trim(),subject:$('#fSub').value.trim()};
  const er=m=>{$('#err').textContent=m};
  if(!c.name||!c.subject)return er('اكتب الفصل والمادة.');
  if(c.p+c.n-1>S.periods.length)return er('الحصتين خارج عدد الحصص، اختار مدة حصة واحدة.');
  if(S.classes.some(x=>x.id!==edit&&x.day===c.day&&x.p<c.p+c.n&&c.p<x.p+x.n))return er('في حصة تانية في نفس الوقت ده.');
  if(edit)Object.assign(S.classes.find(x=>x.id===edit),c);else{c.id='c'+Date.now();S.classes.push(c)}
  save();$('#dlg').close();render();
};

$('#setBtn').onclick=()=>{const i=S.info;
  $('#iGov').value=i.gov;$('#iAdm').value=i.admin;$('#iSch').value=i.school;$('#iTea').value=i.teacher;
  $('#fLead').value=S.lead;$('#fSnd').checked=S.sound;$('#fVc').checked=S.voice;$('#err2').textContent='';
  $('#pRows').innerHTML=S.periods.map((p,k)=>`<div class="row" style="margin-bottom:6px"><span>حصة ${k+1}</span><input type="time" data-s="${k}" value="${p.start}"><input type="time" data-e="${k}" value="${p.end}"></div>`).join('');
  $('#dlg2').showModal()};
$('#sCancel').onclick=()=>$('#dlg2').close();
$('#sSave').onclick=()=>{
  const np=S.periods.map((p,k)=>({start:$('[data-s="'+k+'"]').value,end:$('[data-e="'+k+'"]').value}));
  for(let k=0;k<np.length;k++)if(!np[k].start||!np[k].end||mins(np[k].end)<=mins(np[k].start)){$('#err2').textContent='راجع مواعيد الحصة '+(k+1)+': النهاية لازم تكون بعد البداية.';return}
  S.info={corner:S.info.corner,gov:$('#iGov').value.trim(),admin:$('#iAdm').value.trim(),school:$('#iSch').value.trim()||'جدول الحصص',teacher:$('#iTea').value.trim()};
  S.lead=Math.min(60,Math.max(1,+$('#fLead').value||5));S.sound=$('#fSnd').checked;S.voice=$('#fVc').checked;S.periods=np;
  save();$('#dlg2').close();render()};
$('#testBtn').onclick=()=>{unlock();alertClass(S.classes[0]||{name:'7/2',subject:'E',p:1,n:1},S.lead)};

/* ---- التنبيهات: صوت + كلام + إشعار + رسالة على الشاشة ---- */
let AC;
function unlock(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
['click','touchstart'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
function beep(){if(!AC)return;[0,.4,.8].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;
  o.type='sine';o.frequency.value=880;o.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.6,s+.03);g.gain.exponentialRampToValueAtTime(.0001,s+.3);o.start(s);o.stop(s+.32)})}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function toast(html){const t=$('#toast');t.innerHTML='<span>'+html+'</span><button>حسناً</button>';t.hidden=false;t.querySelector('button').onclick=()=>{t.hidden=true};clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true},90000)}
async function alertClass(c,mm){
  const title='باقي '+mw(mm)+' على الحصة',body='فصل '+c.name+' - '+c.subject+' | '+hmf(st(c));
  toast('<b>'+title+'</b><br>'+esc(body));
  if(S.sound)beep();
  if(S.voice)setTimeout(()=>speak('باقي '+mw(mm)+' على حصة فصل '+c.name.replace('/',' ')),S.sound?1400:0);
  try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}
  if('Notification' in window&&Notification.permission==='granted'){
    try{const r=await navigator.serviceWorker.getRegistration();
      if(r)await r.showNotification(title,{body,icon:'icon-192.png',vibrate:[300,150,300],tag:'cls'+c.id,renotify:true,requireInteraction:true,lang:'ar',dir:'rtl'});
      else new Notification(title,{body})}catch(e){try{new Notification(title,{body})}catch(_){}}}
}
function tick(){
  const n=new Date(),nm=n.getHours()*60+n.getMinutes()+n.getSeconds()/60,ds=n.getFullYear()+'-'+n.getMonth()+'-'+n.getDate();
  byDay(n.getDay()).forEach(c=>{const diff=mins(st(c))-nm,k=ds+c.id;
    if(diff>0&&diff<=S.lead&&!S.notified[k]){S.notified[k]=1;alertClass(c,Math.min(S.lead,Math.ceil(diff)))}});
  Object.keys(S.notified).forEach(k=>{if(!k.startsWith(ds))delete S.notified[k]});save();
}
$('#permBtn').onclick=async()=>{unlock();try{await Notification.requestPermission()}catch(e){}render()};
setInterval(tick,10000);setInterval(render,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();tick()}});

/* ---- تصدير للتقويم (.ics) مع تنبيه قبل الحصة ---- */
function buildICS(){
  const p=n=>String(n).padStart(2,'0'),stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const e=s=>s.replace(/[\\;,]/g,'\\$&');
  const o=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Golden Schedule//AR','CALSCALE:GREGORIAN'];
  S.classes.forEach(c=>{
    const d=new Date();d.setHours(0,0,0,0);while(d.getDay()!==c.day)d.setDate(d.getDate()+1);
    const f=t=>d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+t.replace(':','')+'00';
    o.push('BEGIN:VEVENT','UID:'+c.id+'@golden-schedule','DTSTAMP:'+stamp,'DTSTART:'+f(st(c)),'DTEND:'+f(en(c)),
      'RRULE:FREQ=WEEKLY;BYDAY='+ICS[c.day],'SUMMARY:'+e('حصة '+c.subject+' - فصل '+c.name),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:حصة قريبة','TRIGGER:-PT'+S.lead+'M','END:VALARM','END:VEVENT')});
  o.push('END:VCALENDAR');return o.join('\r\n');
}
$('#icsBtn').onclick=async()=>{
  if(!S.classes.length){alert('أضف حصة واحدة على الأقل الأول.');return}
  const file=new File([buildICS()],'golden-schedule.ics',{type:'text/calendar'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'جدول الحصص'});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download='golden-schedule.ics';document.body.appendChild(a);a.click();a.remove();
};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();tick();
</script>
</body>
